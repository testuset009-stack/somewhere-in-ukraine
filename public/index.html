<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1"
>
<title>Десь в Україні — ТВ</title>
<link rel="stylesheet" href="tv.css?v=2">
</head>
<body>
<div
id="secret-debug-zone"
aria-hidden="true"
></div>
<button
id="corner-host-btn"
type="button"
style="display: none;"
>📱 Пульт</button>
<div id="tv-stage">
<canvas
id="game-canvas"
width="1920"
height="1080"
></canvas>
</div>
<div
id="waiting-screen"
class="theme-standard"
>
<div class="wait-box">
<div
id="wait-title"
class="wait-title"
>ДЕСЬ В УКРАЇНІ</div>
<div
id="wait-sub"
class="wait-sub"
>ВІКТОРИНА ПО ОБЛАСТЯХ УКРАЇНИ</div>
<div
id="wait-hint"
class="wait-hint"
>Оберіть або запустіть гру з пульта</div>
<div class="wait-actions">
<button
id="tv-fs-btn"
type="button"
class="wait-btn"
>⛶ НА ВЕСЬ ЕКРАН</button>
<button
id="tv-sound-btn"
type="button"
class="wait-btn sound-on"
>🔊 ЗВУК: УВІМК.</button>
<button
id="tv-host-btn"
type="button"
class="wait-btn host-accent"
style="display: none;"
>📱 ПУЛЬТ ВЕДУЧОГО</button>
</div>
</div>
</div>
<iframe
id="debug-host-frame"
></iframe>
<script src="ukraine-map.js?v=2"></script>
<script src="tvscale.js?v=2"></script>
<script src="i18n-client.js?v=2"></script>
<script src="renderer.js?v=2"></script>
<script src="tv.js?v=2"></script>
</body>
</html>
